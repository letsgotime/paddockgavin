<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 174 120" fill="none">
  <!-- P letter — gold #F2C94C -->
  <text x="8" y="96" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="108" fill="#F2C94C" letter-spacing="-8">P</text>
  <!-- G letter — Speed Blue #57C7F5, offset right and slightly overlapping -->
  <text x="62" y="96" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="108" fill="#57C7F5" letter-spacing="-8">G</text>
  <!-- Speed stripe accent under G -->
  <rect x="62" y="100" width="104" height="4" rx="2" fill="#EF4A18" opacity="0.7"/>
</svg>
